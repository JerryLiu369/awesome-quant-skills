name: CI & Skills Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate mirrored SKILL.md files
        run: |
          python -c "
          import glob, os, re, sys
          for required in ['LICENSE', 'NOTICE.md', 'SECURITY.md']:
              if not os.path.exists(required):
                  sys.exit(f'Missing {required}')
          with open('NOTICE.md', 'r', encoding='utf-8') as f:
              notices = f.read()
          skills = sorted(glob.glob('skills/*/SKILL.md') + glob.glob('skills/*/*/SKILL.md'))
          skills = [p.replace(os.sep, '/') for p in skills]
          if not skills:
              sys.exit('No mirrored skills found under skills/')
          print(f'Mirrored skills found: {len(skills)}')
          errors = []
          for p in skills:
              if os.path.getsize(p) == 0:
                  errors.append(f'Empty file: {p}')
                  continue
              with open(p, 'r', encoding='utf-8', errors='replace') as f:
                  text = f.read()
              m = re.search(r'^---\s*\n(.*?)---', text, re.S | re.M)
              fm = m.group(1) if m else ''
              if 'name:' not in fm or 'description:' not in fm:
                  errors.append(f'Invalid SKILL.md frontmatter (needs name: + description:): {p}')
              if 'Imported from:' not in text:
                  errors.append(f'Missing Imported from header: {p}')
              if p not in notices:
                  errors.append(f'Skill not listed in NOTICE.md: {p}')
          if errors:
              print('Validation errors:\n' + '\n'.join(errors))
              sys.exit(1)
          print('All skill files validated successfully.')
          "

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 100-103,200-299,403,429
            './README.md' './CONTRIBUTING.md' './NOTICE.md' './SECURITY.md'
            './skills/**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
