name: CI & Skills Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate repository & mirrored SKILL.md files
        run: python scripts/validate.py

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Excludes are placeholders / non-GET-checkable URLs, not dead links:
          # localhost = local-run examples in mirrored skills;
          # Owner/Repo = CONTRIBUTING template placeholder;
          # quantbuddy.cn = POST-only API endpoints (GET 404s by design);
          # financialmodelingprep.com = bot-blocks non-browser agents (403);
          # fulltextSearch/{code6}, MCP_HOST = template URLs with placeholders;
          # github.com/rollysys/.* = rollysys/use_cninfo upstream was taken offline,
          #   and this repo preserves its out-of-print local mirror at
          #   skills/china-markets/cninfo-disclosure/SKILL.md;
          # file:// = relative links to companion files (scripts/, references/)
          #   that live upstream; mirrors here are SKILL.md-only by design
          #   (see NOTICE.md), so those resolve upstream, not locally.
          args: >-
            --no-progress
            --max-retries 3
            --exclude 'file://.*'
            --exclude 'http://127\.0\.0\.1.*'
            --exclude 'http://localhost.*'
            --exclude 'github\.com/Owner/Repo'
            --exclude 'github\.com/rollysys/.*'
            --exclude 'quantbuddy\.cn/.*'
            --exclude 'financialmodelingprep\.com/.*'
            --exclude 'fulltextSearch'
            --exclude 'MCP_HOST'
            './README.md' './README.zh-CN.md' './CONTRIBUTING.md' './NOTICE.md' './SECURITY.md'
            './skills/**/*.md' './scripts/*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
